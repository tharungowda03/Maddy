<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="logged-out">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#" aria-label="Home">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/logo.svg" alt="" />
          </span>
          <span class="brand-name">Chat</span>
        </a>
        <button class="icon-btn sidebar-toggle" id="sidebarToggleBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <div class="sidebar-search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search chats" />
      </div>

      <div class="sidebar-section-label">Recents</div>
      <nav class="chat-history" id="chatHistory" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button class="footer-item" id="settingsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Settings</span>
        </button>

        <div class="account" id="accountBtn" tabindex="0">
          <div class="avatar" id="accountAvatar">U</div>
          <div class="account-info">
            <div class="account-name" id="accountName">Guest</div>
            <div class="account-email" id="accountEmail">Sign in to continue</div>
          </div>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <div class="account-dropdown" id="accountDropdown" role="menu">
            <button class="dropdown-item" data-action="profile">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              Profile
            </button>
            <button class="dropdown-item" data-action="settings">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1"/></svg>
              Settings
            </button>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item" data-action="logout">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">New chat</div>
        <div class="topbar-right"></div>
      </header>

      <section class="login-screen" id="loginScreen">
        <div class="login-card" role="dialog" aria-labelledby="loginTitle">
          <div class="login-logo" aria-hidden="true">
            <img src="assets/logo.svg" alt="" />
          </div>
          <h1 class="login-title" id="loginTitle">Welcome</h1>
          <p class="login-sub">Enter your details to continue</p>
          <form id="loginForm" class="login-form" novalidate>
            <label class="field">
              <span class="field-label">Name</span>
              <input type="text" id="loginName" required autocomplete="name" placeholder="Your name" />
            </label>
            <label class="field">
              <span class="field-label">Email</span>
              <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" />
            </label>
            <p class="login-error" id="loginError" role="alert" hidden></p>
            <button type="submit" class="btn-primary">Continue</button>
          </form>
        </div>
      </section>

      <section class="chat is-empty" id="chatScreen" hidden>
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner">
            <div class="chat-welcome" id="chatWelcome">
              <div class="welcome-mark" aria-hidden="true">
                <img src="assets/logo.svg" alt="" />
              </div>
              <h1>Welcome to Maddy Bot</h1>
              <p>What’s on your mind today?</p>
            </div>
            <div id="chatMessages"></div>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea id="composerInput" rows="1" placeholder="How can I help you today?" aria-label="Message"></textarea>
            <div class="composer-toolbar">
              <div class="model-selector" id="modelSelector">
                <button type="button" class="model-btn" id="modelBtn" aria-haspopup="listbox" aria-expanded="false">
                  <span id="modelLabel">Gemini</span>
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <ul class="model-menu" id="modelMenu" role="listbox">
                  <li role="option" data-model="gemini-2.5-flash">Gemini</li>
                  <li role="option" data-model="llama-3.3-70b-versatile">Groq</li>
                  <li role="option" data-model="gpt-4o">OpenAI</li>
                  <li role="option" data-model="deepseek/deepseek-chat">OpenRouter</li>
                </ul>
              </div>
              <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
              </button>
            </div>
          </form>
          <div class="composer-hint">AI can make mistakes. Verify important information.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" id="settingsCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <section class="settings-section">
          <h3>Appearance</h3>
          <div class="theme-options">
            <button class="theme-option" data-theme="light">Light</button>
            <button class="theme-option" data-theme="dark">Dark</button>
            <button class="theme-option" data-theme="system">System</button>
          </div>
        </section>
        <section class="settings-section">
          <h3>Profile</h3>
          <label class="field">
            <span class="field-label">Name</span>
            <input type="text" id="settingsName" />
          </label>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" id="settingsEmail" />
          </label>
          <button class="btn-secondary" id="saveProfileBtn">Save profile</button>
        </section>
        <section class="settings-section">
          <h3>Application</h3>
          <button class="btn-danger" id="clearHistoryBtn">Clear chat history</button>
        </section>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="renameModal" hidden>
    <div class="modal modal-sm" role="dialog">
      <div class="modal-header">
        <h2>Rename chat</h2>
        <button class="icon-btn" id="renameCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Title</span>
          <input type="text" id="renameInput" />
        </label>
        <div class="modal-actions">
          <button class="btn-secondary" id="renameCancelBtn">Cancel</button>
          <button class="btn-primary" id="renameSaveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
